<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-uml" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polyline points="2,1 11,6 2,11" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- SYSTEM BOUNDARY -->
  <rect x="230" y="30" width="910" height="520" fill="#fafbfc" stroke="#222222" stroke-width="1.8" rx="4" />
  <rect x="230" y="30" width="910" height="42" fill="#f1f5f9" stroke="#222222" stroke-width="1.8" />
  <text x="685.0" y="57" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">SmartWMS - Sơ đồ chi tiết UC02: Lập phiếu nhập kho</text>

  <!-- ACTOR -->
  
  <g transform="translate(75, 200)">
    <circle cx="45" cy="25" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2" />
    <line x1="45" y1="43" x2="45" y2="105" stroke="#222222" stroke-width="2.6" />
    <line x1="12" y1="68" x2="78" y2="68" stroke="#222222" stroke-width="2.6" />
    <line x1="45" y1="105" x2="18" y2="165" stroke="#222222" stroke-width="2.6" />
    <line x1="45" y1="105" x2="72" y2="165" stroke="#222222" stroke-width="2.6" />
    <text x="45" y="195" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111111">Nhân viên kho</text>
    <text x="45" y="214" text-anchor="middle" font-size="13" fill="#555555">Maker</text>
  </g>
  <!-- SOLID LINE -->
  <line x1="165" y1="290" x2="325.9" y2="306.9" stroke="#222222" stroke-width="1.8" />
  <!-- USE CASES -->
  
  <g filter="url(#shadow)">
    <ellipse cx="450" cy="320" rx="130" ry="44" fill="#90caf9" stroke="#1565c0" stroke-width="2.2" />
    <text x="450" y="326" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#000000">Lập phiếu nhập kho</text>
  </g>
  
  <g filter="url(#shadow)">
    <ellipse cx="920" cy="190" rx="140" ry="42" fill="#90caf9" stroke="#1565c0" stroke-width="2.2" />
    <text x="920" y="196" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#000000">Tra cứu Đơn mua hàng PO</text>
  </g>
  
  <g filter="url(#shadow)">
    <ellipse cx="920" cy="320" rx="140" ry="42" fill="#90caf9" stroke="#1565c0" stroke-width="2.2" />
    <text x="920" y="326" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#000000">Chỉ định vị trí ô kệ cất hàng</text>
  </g>
  
  <g filter="url(#shadow)">
    <ellipse cx="920" cy="450" rx="140" ry="42" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.2" stroke-dasharray="4,3" />
    <text x="920" y="456" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1565c0">Từ chối nhận hàng lỗi</text>
  </g>
  <!-- ARROWS -->
  
  <line x1="550.7" y1="292.2" x2="817.1" y2="218.5" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-uml)" />
  <text x="683.9" y="238.3" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">&lt;&lt;include&gt;&gt;</text>
  
  <line x1="580.0" y1="320.0" x2="780.0" y2="320.0" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-uml)" />
  <text x="680.0" y="303.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">&lt;&lt;include&gt;&gt;</text>
  
  <line x1="817.1" y1="421.5" x2="550.7" y2="347.8" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-uml)" />
  <text x="683.9" y="367.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">&lt;&lt;extend&gt;&gt;</text>
</svg>