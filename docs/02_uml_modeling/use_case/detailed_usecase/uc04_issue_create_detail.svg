<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 640" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow-uml" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polyline points="2,1 11,6 2,11" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- SYSTEM BOUNDARY -->
  <rect x="230" y="30" width="1110" height="580" fill="#fafbfc" stroke="#222222" stroke-width="1.8" rx="4" />
  <rect x="230" y="30" width="1110" height="42" fill="#f1f5f9" stroke="#222222" stroke-width="1.8" />
  <text x="785.0" y="57" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111111">SmartWMS - Sơ đồ chi tiết UC04: Lập phiếu xuất kho</text>

  <!-- ACTOR -->
  
  <g transform="translate(75, 230)">
    <circle cx="45" cy="25" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2" />
    <line x1="45" y1="43" x2="45" y2="105" stroke="#222222" stroke-width="2.6" />
    <line x1="12" y1="68" x2="78" y2="68" stroke="#222222" stroke-width="2.6" />
    <line x1="45" y1="105" x2="18" y2="165" stroke="#222222" stroke-width="2.6" />
    <line x1="45" y1="105" x2="72" y2="165" stroke="#222222" stroke-width="2.6" />
    <text x="45" y="195" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111111">Nhân viên kho</text>
    <text x="45" y="214" text-anchor="middle" font-size="13" fill="#555555">Maker</text>
  </g>
  <!-- SOLID LINE -->
  <line x1="165" y1="320" x2="303.4" y2="330.4" stroke="#222222" stroke-width="1.8" />
  <!-- USE CASES -->
  
  <g filter="url(#shadow)">
    <ellipse cx="430" cy="340" rx="130" ry="42" fill="#90caf9" stroke="#1565c0" stroke-width="2.2" />
    <text x="430" y="346" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#000000">Lập phiếu xuất kho</text>
  </g>
  
  <g filter="url(#shadow)">
    <ellipse cx="800" cy="200" rx="135" ry="40" fill="#90caf9" stroke="#1565c0" stroke-width="2.2" />
    <text x="800" y="206" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#000000">Kiểm tra tồn khả dụng</text>
  </g>
  
  <g filter="url(#shadow)">
    <ellipse cx="800" cy="340" rx="135" ry="40" fill="#90caf9" stroke="#1565c0" stroke-width="2.2" />
    <text x="800" y="346" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#000000">Gợi ý lô FEFO và FIFO</text>
  </g>
  
  <g filter="url(#shadow)">
    <ellipse cx="800" cy="480" rx="135" ry="40" fill="#90caf9" stroke="#1565c0" stroke-width="2.2" />
    <text x="800" y="486" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#000000">Tạm giữ chỗ tồn kho</text>
  </g>
  
  <g filter="url(#shadow)">
    <ellipse cx="1170" cy="340" rx="135" ry="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.2" stroke-dasharray="4,3" />
    <text x="1170" y="346" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1565c0">Giải trình xuất ngoại lệ</text>
  </g>
  <!-- ARROWS -->
  
  <line x1="514.4" y1="308.1" x2="716.8" y2="231.5" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-uml)" />
  <text x="615.6" y="252.8" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">&lt;&lt;include&gt;&gt;</text>
  
  <line x1="560.0" y1="340.0" x2="665.0" y2="340.0" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-uml)" />
  <text x="612.5" y="323.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">&lt;&lt;include&gt;&gt;</text>
  
  <line x1="514.4" y1="371.9" x2="716.8" y2="448.5" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-uml)" />
  <text x="615.6" y="393.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">&lt;&lt;include&gt;&gt;</text>
  
  <line x1="1035.0" y1="340.0" x2="935.0" y2="340.0" stroke="#222222" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-uml)" />
  <text x="985.0" y="323.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">&lt;&lt;extend&gt;&gt;</text>
</svg>