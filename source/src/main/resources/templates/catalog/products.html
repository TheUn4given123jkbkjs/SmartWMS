<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout/main :: head('Danh Mục Hàng Hóa')}"></head>
  <body data-page="products">
    <a class="skip-link" href="#content">Đến nội dung</a>
    <aside th:replace="~{layout/main :: sidebar('products')}"></aside>
    <div class="wms-main-wrapper">
      <header
        th:replace="~{layout/main :: topbar('Danh Mục Hàng Hóa')}"
      ></header>
      <main class="wms-content-body" id="content">
        <div class="page-heading">
          <div>
            <span class="eyebrow">SMARTWMS / VẬN HÀNH KHO</span>
            <h1>Danh Mục Hàng Hóa</h1>
            <p>Quản lý mã hàng, đơn vị tính và định mức tồn an toàn.</p>
          </div>
          <span id="updated" class="muted small"></span>
        </div>
        <div th:replace="~{layout/main :: feedback}"></div>
        <div class="toolbar">
          <div class="field">
            <label for="search">Tìm kiếm</label
            ><input
              class="form-control"
              id="search"
              name="search"
              type="search"
              placeholder="Nhập mã hoặc tên…"
            /><small class="field-error" data-error="search"></small>
          </div>
          <div class="field">
            <label for="categoryFilter">Nhóm hàng</label
            ><select
              class="form-select"
              id="categoryFilter"
              name="categoryFilter"
            ></select
            ><small class="field-error" data-error="categoryFilter"></small>
          </div>
          <div class="field">
            <label for="activeFilter">Trạng thái</label
            ><select class="form-select" id="activeFilter" name="activeFilter">
              <option value="">Tất cả</option>
              <option value="true">Hoạt động</option>
              <option value="false">Ngừng hoạt động</option></select
            ><small class="field-error" data-error="activeFilter"></small>
          </div>
          <button type="button" class="btn btn-orange-primary" id="add">
            + Thêm mặt hàng</button
          ><button type="button" class="btn btn-light" id="refresh">
            Làm mới
          </button>
        </div>
        <section class="work-card">
          <h2>Danh sách mặt hàng</h2>
          <div id="table" class="data-region" aria-live="polite">
            Đang tải dữ liệu…
          </div>
        </section>
        <dialog id="editDialog">
          <form id="editForm">
            <div class="d-flex justify-content-between">
              <h2>Thêm mặt hàng</h2>
              <button
                type="button"
                class="btn btn-light"
                data-close
                aria-label="Đóng"
              >
                ×
              </button>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="skuCode">Mã SKU *</label
                ><input
                  class="form-control"
                  id="skuCode"
                  name="skuCode"
                  type="text"
                  required
                  pattern="[A-Z0-9-]{3,30}"
                  maxlength="30"
                /><small class="field-error" data-error="skuCode"></small>
              </div>
              <div class="field">
                <label for="name">Tên hàng *</label
                ><input
                  class="form-control"
                  id="name"
                  name="name"
                  type="text"
                  required
                  maxlength="255"
                /><small class="field-error" data-error="name"></small>
              </div>
              <div class="field">
                <label for="categoryId">Nhóm hàng *</label
                ><select
                  class="form-select"
                  id="categoryId"
                  name="categoryId"
                  required
                ></select
                ><small class="field-error" data-error="categoryId"></small>
              </div>
              <div class="field">
                <label for="uom">Đơn vị tính *</label
                ><input
                  class="form-control"
                  id="uom"
                  name="uom"
                  type="text"
                  required
                  maxlength="20"
                /><small class="field-error" data-error="uom"></small>
              </div>
              <div class="field">
                <label for="minStock">Tồn tối thiểu *</label
                ><input
                  class="form-control"
                  id="minStock"
                  name="minStock"
                  type="number"
                  required
                  min="0"
                  step="0.01"
                  value="0"
                /><small class="field-error" data-error="minStock"></small>
              </div>
              <div class="field">
                <label for="maxStock">Tồn tối đa *</label
                ><input
                  class="form-control"
                  id="maxStock"
                  name="maxStock"
                  type="number"
                  required
                  min="0.01"
                  step="0.01"
                /><small class="field-error" data-error="maxStock"></small>
              </div>
              <div class="field">
                <label for="manageByLot">Quản lý theo lô</label
                ><select
                  class="form-select"
                  id="manageByLot"
                  name="manageByLot"
                >
                  <option value="true">Có</option>
                  <option value="false">Không</option></select
                ><small class="field-error" data-error="manageByLot"></small>
              </div>
            </div>
            <p id="formError" class="text-danger" role="alert"></p>
            <div class="modal-actions">
              <button type="button" class="btn btn-light" data-close>Hủy</button
              ><button class="btn btn-orange-primary" type="submit">
                Lưu thông tin
              </button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
    <th:block th:replace="~{layout/main :: scripts}"></th:block>
  </body>
</html>
