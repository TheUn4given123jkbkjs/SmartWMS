<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout/main :: head('Bốc Hàng Pick List')}"></head>
  <body data-page="pick">
    <a class="skip-link" href="#content">Đến nội dung</a>
    <aside th:replace="~{layout/main :: sidebar('pick')}"></aside>
    <div class="wms-main-wrapper">
      <header
        th:replace="~{layout/main :: topbar('Bốc Hàng Pick List')}"
      ></header>
      <main class="wms-content-body" id="content">
        <div class="page-heading">
          <div>
            <span class="eyebrow">SMARTWMS / VẬN HÀNH KHO</span>
            <h1>Bốc Hàng Pick List</h1>
            <p>Theo dõi lệnh xuất và danh sách vị trí cần lấy hàng.</p>
          </div>
          <span id="updated" class="muted small"></span>
        </div>
        <div th:replace="~{layout/main :: feedback}"></div>
        <div class="toolbar">
          <div class="field">
            <label for="search">Tìm kiếm</label
            ><input
              class="form-control"
              id="search"
              name="search"
              type="search"
              placeholder="Nhập mã hoặc tên…"
            /><small class="field-error" data-error="search"></small>
          </div>
          <div class="field">
            <label for="status">Trạng thái</label
            ><select class="form-select" id="status" name="status">
              <option value="">Tất cả trạng thái</option>
              <option value="PENDING_APPROVAL">Chờ duyệt</option>
              <option value="APPROVED">Đã duyệt</option>
              <option value="APPROVED_READY_TO_PICK">Đã duyệt — chờ bốc</option>
              <option value="COMPLETED">Hoàn tất</option>
              <option value="REJECTED">Từ chối</option>
              <option value="CANCELLED">Đã hủy</option></select
            ><small class="field-error" data-error="status"></small>
          </div>
          <button type="button" class="btn btn-light" id="refresh">
            Làm mới
          </button>
        </div>
        <section class="work-card">
          <h2>Lệnh xuất kho</h2>
          <div id="table" class="data-region" aria-live="polite">
            Đang tải dữ liệu…
          </div>
        </section>
      </main>
    </div>
    <th:block th:replace="~{layout/main :: scripts}"></th:block>
  </body>
</html>
