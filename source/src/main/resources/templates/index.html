<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout/main :: head('Tổng Quan Kho')}"></head>
  <body data-page="dashboard">
    <a class="skip-link" href="#content">Đến nội dung</a>
    <aside th:replace="~{layout/main :: sidebar('dashboard')}"></aside>
    <div class="wms-main-wrapper">
      <header th:replace="~{layout/main :: topbar('Tổng Quan Kho')}"></header>
      <main class="wms-content-body" id="content">
        <div class="page-heading">
          <div>
            <span class="eyebrow">SMARTWMS / VẬN HÀNH KHO</span>
            <h1>Tổng Quan Kho</h1>
            <p>Theo dõi công việc và những mặt hàng cần xử lý hôm nay.</p>
          </div>
          <span id="updated" class="muted small"></span>
        </div>
        <div th:replace="~{layout/main :: feedback}"></div>
        <div class="quick-actions">
          <a class="btn btn-orange-primary" href="/receipt/create"
            >+ Lập phiếu nhập</a
          ><a class="btn btn-outline-secondary" href="/issue/create"
            >Lập lệnh xuất</a
          ><a class="btn btn-light" href="/inventory/stock-card"
            >Tra cứu thẻ kho</a
          ><button type="button" class="btn btn-light" id="refresh">
            Làm mới
          </button>
        </div>
        <div id="metrics" class="data-region" aria-live="polite">
          Đang tải dữ liệu…
        </div>
        <div class="dashboard-grid">
          <section class="work-card">
            <h2>Cần bổ sung hàng</h2>
            <div id="low" class="data-region" aria-live="polite">
              Đang tải dữ liệu…
            </div>
          </section>
          <section class="work-card">
            <h2>Ưu tiên xuất theo hạn dùng</h2>
            <div id="expiry" class="data-region" aria-live="polite">
              Đang tải dữ liệu…
            </div>
          </section>
        </div>
      </main>
    </div>
    <th:block th:replace="~{layout/main :: scripts}"></th:block>
  </body>
</html>
