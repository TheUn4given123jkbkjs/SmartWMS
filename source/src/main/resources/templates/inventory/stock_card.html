<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout/main :: head('Sổ Thẻ Kho')}"></head>
  <body data-page="stock">
    <a class="skip-link" href="#content">Đến nội dung</a>
    <aside th:replace="~{layout/main :: sidebar('stock')}"></aside>
    <div class="wms-main-wrapper">
      <header th:replace="~{layout/main :: topbar('Sổ Thẻ Kho')}"></header>
      <main class="wms-content-body" id="content">
        <div class="page-heading">
          <div>
            <span class="eyebrow">SMARTWMS / VẬN HÀNH KHO</span>
            <h1>Sổ Thẻ Kho</h1>
            <p>Đối soát số dư và truy vết lịch sử biến động.</p>
          </div>
          <span id="updated" class="muted small"></span>
        </div>
        <div th:replace="~{layout/main :: feedback}"></div>
        <form id="filterForm" class="toolbar">
          <div class="field">
            <label for="productId">Mặt hàng *</label
            ><select
              class="form-select"
              id="productId"
              name="productId"
              required
            ></select
            ><small class="field-error" data-error="productId"></small>
          </div>
          <div class="field">
            <label for="fromDate">Từ ngày</label
            ><input
              class="form-control"
              id="fromDate"
              name="fromDate"
              type="date"
              required
            /><small class="field-error" data-error="fromDate"></small>
          </div>
          <div class="field">
            <label for="toDate">Đến ngày</label
            ><input
              class="form-control"
              id="toDate"
              name="toDate"
              type="date"
              required
            /><small class="field-error" data-error="toDate"></small>
          </div>
          <button class="btn btn-orange-primary">Lọc dữ liệu</button>
        </form>
        <section class="work-card">
          <h2>Tra cứu theo lô / vị trí</h2>
          <div class="toolbar">
            <div class="field">
              <label for="batchKeyword">SKU, lô hoặc vị trí</label
              ><input class="form-control" id="batchKeyword" type="search" />
            </div>
            <div class="field">
              <label for="batchZone">Khu vực</label
              ><select class="form-select" id="batchZone">
                <option value="">Tất cả</option>
                <option>RAW</option>
                <option>FG</option>
                <option>DOCK</option>
                <option>INSP</option>
                <option>SCRAP</option>
              </select>
            </div>
            <div class="field">
              <label for="batchStatus">Trạng thái</label
              ><select class="form-select" id="batchStatus">
                <option value="">Tất cả</option>
                <option value="IN_STOCK">Còn hàng</option>
                <option value="OUT_OF_STOCK">Hết khả dụng</option>
                <option value="EXPIRED">Quá hạn</option>
              </select>
            </div>
            <div class="field">
              <label for="batchCategory">Nhóm hàng</label
              ><select id="batchCategory" class="form-select"></select>
            </div>
            <button type="button" class="btn btn-light" id="filterBatches">
              Lọc lô / vị trí
            </button>
          </div>
          <div id="batchTable"></div>
        </section>
        <section class="work-card">
          <h2>Tồn hiện tại</h2>
          <div id="stock" class="data-region" aria-live="polite">
            Đang tải dữ liệu…
          </div>
        </section>
        <div id="summary" class="data-region" aria-live="polite">
          Đang tải dữ liệu…
        </div>
        <section class="work-card">
          <h2>Lịch sử biến động</h2>
          <div id="history">Chọn mặt hàng và khoảng ngày để tra cứu.</div>
        </section>
      </main>
    </div>
    <th:block th:replace="~{layout/main :: scripts}"></th:block>
  </body>
</html>
