<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout/main :: head('Cảnh Báo Tồn Kho')}"></head>
  <body data-page="alerts">
    <a class="skip-link" href="#content">Đến nội dung</a>
    <aside th:replace="~{layout/main :: sidebar('alerts')}"></aside>
    <div class="wms-main-wrapper">
      <header
        th:replace="~{layout/main :: topbar('Cảnh Báo Tồn Kho')}"
      ></header>
      <main class="wms-content-body" id="content">
        <div class="page-heading">
          <div>
            <span class="eyebrow">SMARTWMS / VẬN HÀNH KHO</span>
            <h1>Cảnh Báo Tồn Kho</h1>
            <p>Theo dõi thiếu hụt hàng hóa và thời hạn sử dụng.</p>
          </div>
          <span id="updated" class="muted small"></span>
        </div>
        <div th:replace="~{layout/main :: feedback}"></div>
        <div class="toolbar">
          <div class="field">
            <label for="search">Tìm kiếm</label
            ><input
              class="form-control"
              id="search"
              name="search"
              type="search"
              placeholder="Nhập mã hoặc tên…"
            /><small class="field-error" data-error="search"></small>
          </div>
          <div class="field">
            <label for="thresholdDays">Cận hạn trong (ngày)</label
            ><input
              class="form-control"
              id="thresholdDays"
              name="thresholdDays"
              type="number"
              min="1"
              max="365"
              value="30"
            /><small class="field-error" data-error="thresholdDays"></small>
          </div>
          <button type="button" class="btn btn-light" id="refresh">
            Làm mới
          </button>
        </div>
        <div class="dashboard-grid">
          <section class="work-card">
            <h2>Cảnh báo tồn thấp</h2>
            <div id="low" class="data-region" aria-live="polite">
              Đang tải dữ liệu…
            </div>
          </section>
          <section class="work-card">
            <h2>Lô cận hạn / quá hạn</h2>
            <div id="expiry" class="data-region" aria-live="polite">
              Đang tải dữ liệu…
            </div>
          </section>
        </div>
      </main>
    </div>
    <th:block th:replace="~{layout/main :: scripts}"></th:block>
  </body>
</html>
