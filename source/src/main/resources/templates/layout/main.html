<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' · SmartWMS'">SmartWMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link th:href="@{/css/dashboard.css}" rel="stylesheet" />
    <link th:href="@{/css/workspace.css}" rel="stylesheet" />
    <link th:href="@{/css/warehouse-map.css}" rel="stylesheet" />
  </head>
  <body>
    <aside th:fragment="sidebar(active)" class="wms-sidebar" id="sidebar">
      <a href="/app" class="sidebar-brand"
        ><i class="bi bi-boxes"></i
        ><span class="brand-text">Smart<span>WMS</span></span></a
      >
      <div class="sidebar-nav">
        <div class="nav-section-title">KHÔNG GIAN VẬN HÀNH</div>
        <a
          href="/app"
          class="wms-nav-item"
          th:classappend="${active == 'dashboard' ? 'active' : ''}"
          th:attr="aria-current=${active == 'dashboard' ? 'page' : null}"
          ><i class="bi bi-speedometer2" aria-hidden="true"></i>Tổng Quan Kho</a
        ><a
          href="/catalog/products"
          class="wms-nav-item"
          th:classappend="${active == 'products' ? 'active' : ''}"
          th:attr="aria-current=${active == 'products' ? 'page' : null}"
          ><i class="bi bi-boxes" aria-hidden="true"></i>Danh Mục Hàng Hóa</a
        ><a
          href="/catalog/locations"
          class="wms-nav-item"
          th:classappend="${active == 'locations' ? 'active' : ''}"
          th:attr="aria-current=${active == 'locations' ? 'page' : null}"
          ><i class="bi bi-grid-3x3" aria-hidden="true"></i>Sơ Đồ Ô Kệ</a
        ><a
          href="/receipt/create"
          class="wms-nav-item"
          th:classappend="${active == 'receipt' ? 'active' : ''}"
          th:attr="aria-current=${active == 'receipt' ? 'page' : null}"
          ><i class="bi bi-box-arrow-in-down" aria-hidden="true"></i>Lập Phiếu
          Nhập</a
        ><a
          href="/receipt/approve"
          class="wms-nav-item"
          th:classappend="${active == 'approve' ? 'active' : ''}"
          th:attr="aria-current=${active == 'approve' ? 'page' : null}"
          ><i class="bi bi-check2-circle" aria-hidden="true"></i>Phê Duyệt
          Nhập</a
        ><a
          href="/issue/create"
          class="wms-nav-item"
          th:classappend="${active == 'issue' ? 'active' : ''}"
          th:attr="aria-current=${active == 'issue' ? 'page' : null}"
          ><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>Lập Lệnh
          Xuất</a
        ><a
          href="/issue/pick"
          class="wms-nav-item"
          th:classappend="${active == 'pick' ? 'active' : ''}"
          th:attr="aria-current=${active == 'pick' ? 'page' : null}"
          ><i class="bi bi-list-check" aria-hidden="true"></i>Bốc Hàng Pick
          List</a
        ><a
          href="/inventory/stock-card"
          class="wms-nav-item"
          th:classappend="${active == 'stock' ? 'active' : ''}"
          th:attr="aria-current=${active == 'stock' ? 'page' : null}"
          ><i class="bi bi-journal-text" aria-hidden="true"></i>Sổ Thẻ Kho</a
        ><a
          href="/inventory/alerts"
          class="wms-nav-item"
          th:classappend="${active == 'alerts' ? 'active' : ''}"
          th:attr="aria-current=${active == 'alerts' ? 'page' : null}"
          ><i class="bi bi-bell" aria-hidden="true"></i>Cảnh Báo Tồn Kho</a
        >
      </div>
      <div class="sidebar-footer">
        <a href="/" class="btn-sidebar-back">← Về trang giới thiệu</a>
      </div>
    </aside>
    <header th:fragment="topbar(title)" class="wms-topbar">
      <button
        class="btn btn-light menu-toggle"
        aria-label="Mở menu"
        aria-controls="sidebar"
        aria-expanded="false"
        id="menuToggle"
      >
        <i class="bi bi-list"></i></button
      ><span class="small text-muted"
        >KHO TRUNG TÂM <span class="mx-2">/</span>
        <span th:text="${title}"></span
      ></span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="user-info">
          <strong th:text="${session.user.fullName}"></strong
          ><small
            th:text="${session.user.role.name() == 'ROLE_MANAGER' ? 'Quản lý kho' : (session.user.role.name() == 'ROLE_ADMIN' ? 'Quản trị viên' : 'Nhân viên kho')}"
          ></small>
        </div>
        <form method="post" action="/auth/logout">
          <button
            class="btn btn-outline-secondary btn-sm"
            aria-label="Đăng xuất"
            title="Đăng xuất"
          >
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </form>
      </div>
    </header>
    <th:block th:fragment="feedback"
      ><div id="feedback" role="status" aria-live="polite"></div>
      <dialog id="detailDialog">
        <div class="d-flex justify-content-between gap-4">
          <h2 id="detailTitle">Chi tiết</h2>
          <button
            type="button"
            class="btn btn-light"
            data-close
            aria-label="Đóng"
          >
            ×
          </button>
        </div>
        <div id="detailBody"></div>
      </dialog>
      <dialog id="confirmDialog">
        <h2>Xác nhận thao tác</h2>
        <p id="confirmText"></p>
        <div class="d-flex gap-2 justify-content-end">
          <button class="btn btn-light" data-cancel>Quay lại</button
          ><button class="btn btn-orange-primary" data-confirm>Xác nhận</button>
        </div>
      </dialog></th:block
    >
    <th:block th:fragment="scripts"
      ><script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      ></script>
      <script th:src="@{/js/workspace.js}" defer></script
    ></th:block>
  </body>
</html>
