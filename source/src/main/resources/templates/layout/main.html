<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWMS - Quản Lý Kho Hàng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Custom Dashboard Styles -->
    <link th:href="@{/css/dashboard.css}" href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

    <!-- Shared Layout Definition for Thymeleaf Fragments -->
    <aside class="wms-sidebar" th:fragment="sidebar">
        <a href="/" class="sidebar-brand">
            <div class="brand-icon-box"><i class="bi bi-boxes"></i></div>
            <div class="brand-text">Smart<span>WMS</span></div>
        </a>

        <div class="sidebar-nav">
            <div class="nav-section-title">QUẢN TRỊ KHO HÀNG</div>
            <a href="/app" class="wms-nav-item"><i class="bi bi-speedometer2"></i> Tổng Quan Kho</a>
            <a href="/catalog/products" class="wms-nav-item"><i class="bi bi-boxes"></i> Danh Mục Hàng Hóa</a>
            <a href="/catalog/locations" class="wms-nav-item"><i class="bi bi-grid-3x3"></i> Sơ Đồ Ô Kệ</a>
            <a href="/receipt/create" class="wms-nav-item"><i class="bi bi-box-arrow-in-down"></i> Lập Phiếu Nhập</a>
            <a href="/receipt/approve" class="wms-nav-item"><i class="bi bi-check2-circle"></i> Phê Duyệt Nhập</a>
            <a href="/issue/create" class="wms-nav-item"><i class="bi bi-box-arrow-up-right"></i> Lập Lệnh Xuất</a>
            <a href="/issue/pick" class="wms-nav-item"><i class="bi bi-list-check"></i> Bốc Hàng Pick List</a>
            <a href="/inventory/stock-card" class="wms-nav-item"><i class="bi bi-journal-text"></i> Sổ Thẻ Kho</a>
            <a href="/inventory/alerts" class="wms-nav-item"><i class="bi bi-bell"></i> Cảnh Báo Tồn Kho</a>
        </div>

        <div class="sidebar-footer">
            <a href="/" class="btn-sidebar-back"><i class="bi bi-arrow-left"></i> Về Landing Page</a>
        </div>
    </aside>

    <div class="wms-main-wrapper">
        <header class="wms-topbar" th:fragment="topbar(title)">
            <h5 class="fw-bold text-dark m-0" th:text="${title}">Quản Trị Kho</h5>
            <div class="d-flex align-items-center gap-3">
                <span class="small text-muted">Nguyễn Thành Trung (Quản lý kho)</span>
                <a href="/" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i></a>
            </div>
        </header>

        <main class="wms-content-body">
            <!-- Content Placeholder -->
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
