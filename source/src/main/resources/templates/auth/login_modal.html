<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ========================================== -->
<!-- MODAL POPUP: CỔNG ĐĂNG NHẬP KHO NỘI BỘ     -->
<!-- ========================================== -->
<div th:fragment="loginModal" class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <!-- Modal Header -->
            <div class="modal-header border-0 bg-light px-4 pt-4 pb-2">
                <div class="w-100 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <div class="brand-icon-box" style="width: 38px; height: 38px; font-size: 1.25rem;">
                            <i class="bi bi-boxes"></i>
                        </div>
                        <div class="brand-title fs-5">Smart<span>WMS</span></div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
            </div>

            <!-- Modal Sub-header -->
            <div class="px-4 py-2 bg-light border-bottom text-center">
                <span class="badge px-3 py-1 text-uppercase fw-bold" style="background: rgba(255, 106, 0, 0.12); color: #ff6a00; font-size: 0.72rem; letter-spacing: 0.5px;">
                    <i class="bi bi-shield-lock-fill me-1"></i> Phân Hệ Quản Trị Kho Nội Bộ
                </span>
            </div>

            <!-- Modal Body -->
            <div class="modal-body p-4">
                <div class="text-center mb-3">
                    <h5 class="fw-bold text-dark font-heading mb-1">Cổng Đăng Nhập Vận Hành</h5>
                    <p class="text-muted small">Dành riêng cho Cán bộ Quản lý và Nhân viên Tổng kho Yamaha</p>
                </div>

                <!-- Alert Error Message -->
                <div id="modalLoginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="modalLoginAlertMsg">Tài khoản hoặc mật khẩu không chính xác.</span>
                </div>

                <form id="modalLoginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="modalUsername" name="username" placeholder="Nhập tên đăng nhập..." required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label small fw-bold text-dark">Mật khẩu</label>
                            <a href="#" class="small text-decoration-none" style="color: var(--wms-orange, #ff6a00); font-size: 0.78rem;" onclick="alert('Vui lòng liên hệ Quản trị viên hệ thống (Admin) để được cấp lại mật khẩu nội bộ.'); return false;">Quên mật khẩu?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="modalPassword" name="password" placeholder="Nhập mật khẩu..." required>
                            <button class="btn btn-outline-secondary" type="button" onclick="const p = document.getElementById('modalPassword'); p.type = p.type === 'password' ? 'text' : 'password'; this.querySelector('i').classList.toggle('bi-eye'); this.querySelector('i').classList.toggle('bi-eye-slash');">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="modalRememberMe" checked>
                            <label class="form-check-label small text-muted" for="modalRememberMe" style="font-size: 0.8rem;">
                                Ghi nhớ đăng nhập
                            </label>
                        </div>
                        <span class="small text-muted" style="font-size: 0.76rem;">
                            <i class="bi bi-shield-check text-success me-1"></i> Xác thực phiên
                        </span>
                    </div>

                    <button type="submit" id="modalBtnSubmit" class="btn btn-orange-quote w-100 justify-content-center py-2 mb-2" style="background-color: var(--wms-orange, #ff6a00); color: #fff; font-weight: 700; border-radius: 6px;">
                        <i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP VÀO HỆ THỐNG
                    </button>

                    <div class="text-center mt-3">
                        <a href="/auth/login" class="small text-muted text-decoration-none" style="font-size: 0.8rem;">
                            <i class="bi bi-box-arrow-up-right me-1"></i> Mở trang đăng nhập độc lập
                        </a>
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer border-0 bg-light py-2 justify-content-center text-center">
                <span class="small text-muted" style="font-size: 0.74rem;">
                    <i class="bi bi-info-circle me-1"></i> Tài khoản vận hành được cấp phát bởi Quản trị viên (Admin).
                </span>
            </div>
        </div>
    </div>
</div>

<script>
// Xử lý AJAX đăng nhập ngay trên Modal
document.addEventListener("DOMContentLoaded", function() {
    const modalForm = document.getElementById("modalLoginForm");
    if (!modalForm) return;

    modalForm.addEventListener("submit", async function(e) {
        e.preventDefault();
        const btn = document.getElementById("modalBtnSubmit");
        const alertBox = document.getElementById("modalLoginAlert");
        const alertMsg = document.getElementById("modalLoginAlertMsg");

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Đang xác thực...';
        alertBox.classList.add("d-none");

        try {
            const formData = new FormData(modalForm);
            const payload = Object.fromEntries(formData.entries());

            const response = await fetch("/auth/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.message || "Tên đăng nhập hoặc mật khẩu không chính xác.");
            }

            modalForm.reset();
            window.location.assign("/app");
        } catch (err) {
            alertMsg.textContent = err.message;
            alertBox.classList.remove("d-none");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP VÀO HỆ THỐNG';
        }
    });
});
</script>

</body>
</html>
