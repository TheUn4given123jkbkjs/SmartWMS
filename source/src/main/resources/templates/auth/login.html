<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - SmartWMS</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Custom Login Styles -->
    <link th:href="@{/css/login.css}" href="/css/login.css" rel="stylesheet" />
  </head>
  <body>
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="brand-icon-box mb-2"><i class="bi bi-boxes"></i></div>
        <h4 class="fw-bold text-dark m-0">
          Smart<span style="color: #ff6a00">WMS</span>
        </h4>
        <p class="text-muted small mt-1">Cổng Đăng Nhập Quản Trị Kho Vận</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="loginUsername" class="form-label small fw-bold"
            >Tên đăng nhập</label
          >
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"
              ><i class="bi bi-person"></i
            ></span>
            <input
              type="text"
              class="form-control"
              id="loginUsername"
              name="username"
              placeholder="Nhập tên đăng nhập..."
              required
              autofocus
            />
          </div>
        </div>

        <div class="mb-3">
          <label for="loginPassword" class="form-label small fw-bold"
            >Mật khẩu</label
          >
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"
              ><i class="bi bi-lock"></i
            ></span>
            <input
              type="password"
              class="form-control"
              id="loginPassword"
              name="password"
              placeholder="Nhập mật khẩu..."
              required
            />
          </div>
        </div>

        <!-- Tài khoản mẫu demo -->
        <div class="mb-3 p-2 bg-light rounded border text-start">
          <div class="small fw-bold text-muted mb-1" style="font-size: 0.75rem;">
            <i class="bi bi-person-badge me-1"></i> Tài khoản mẫu thử nghiệm (Click để điền nhanh):
          </div>
          <div class="d-flex flex-wrap gap-1">
            <button type="button" class="btn btn-sm btn-outline-dark py-0 px-2" style="font-size: 0.75rem;" onclick="document.getElementById('loginUsername').value='admin'; document.getElementById('loginPassword').value='123456';">
              🛡️ Admin
            </button>
            <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.75rem;" onclick="document.getElementById('loginUsername').value='manager_trung'; document.getElementById('loginPassword').value='123456';">
              📋 Quản lý kho
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size: 0.75rem;" onclick="document.getElementById('loginUsername').value='staff_thien'; document.getElementById('loginPassword').value='123456';">
              📦 Nhân viên kho
            </button>
          </div>
        </div>

        <p class="small text-muted">
          Liên hệ quản trị viên nếu bạn cần cấp lại mật khẩu.
        </p>
        <p id="loginError" role="alert" class="text-danger"></p>
        <button type="submit" class="btn btn-orange mb-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP VÀO HỆ THỐNG
        </button>
      </form>

      <div class="text-center">
        <a href="/" class="small text-muted text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Quay lại Trang Chủ
        </a>
      </div>
    </div>

    <script src="/js/login.js" defer></script>
  </body>
</html>
