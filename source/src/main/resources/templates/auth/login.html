<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - SmartWMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Login Styles -->
    <link th:href="@{/css/login.css}" href="/css/login.css" rel="stylesheet">
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon-box mb-2"><i class="bi bi-boxes"></i></div>
            <h4 class="fw-bold text-dark m-0">Smart<span style="color: #ff6a00;">WMS</span></h4>
            <p class="text-muted small mt-1">Cổng Đăng Nhập Quản Trị Kho Vận</p>
        </div>

        <form action="/app" method="get">
            <div class="mb-3">
                <label class="form-label small fw-bold">Tên đăng nhập / Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="loginUsername" name="username" placeholder="Nhập tài khoản hoặc email..." required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label small text-muted" for="rememberMe">Ghi nhớ đăng nhập</label>
                </div>
                <a href="#" class="small text-decoration-none" style="color: #ff6a00;" onclick="alert('Vui lòng liên hệ Quản trị viên để được cấp lại mật khẩu.'); return false;">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn btn-orange mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> ĐĂNG NHẬP VÀO HỆ THỐNG
            </button>
        </form>

        <div class="text-center">
            <a href="/" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Quay lại Trang Chủ
            </a>
        </div>
    </div>

</body>
</html>
