# Run the JAR from the repository root. Environment variables can also supply the password.
spring.config.import=optional:file:./.env[.properties]
server.address=127.0.0.1
server.port=${SMARTWMS_WEB_PORT:8088}
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/smartwms?sslMode=REQUIRED
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=smartwms_app
spring.datasource.password=${SMARTWMS_DB_PASSWORD}
spring.h2.console.enabled=false
spring.jpa.show-sql=false
