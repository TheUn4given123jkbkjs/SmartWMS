# ===================================================================
# CẤU HÌNH ỨNG DỤNG SPRING BOOT - WAREHOUSE MANAGEMENT SYSTEM (WMS)
# ===================================================================
server.port=8088
server.servlet.context-path=/

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

spring.profiles.default=mysql

# Tắt tự động chạy script SQL thô khi khởi động (để Hibernate và DataInitializer quản lý chuẩn xác)
spring.sql.init.mode=never

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
