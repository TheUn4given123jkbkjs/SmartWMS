# ===================================================================
# CẤU HÌNH ỨNG DỤNG SPRING BOOT - WAREHOUSE MANAGEMENT SYSTEM (WMS)
# ===================================================================
server.port=8080
server.servlet.context-path=/

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cấu hình CSDL MySQL (Bật khi kết nối MySQL thật)
# spring.datasource.url=jdbc:mysql://localhost:3306/wms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình CSDL H2 In-Memory (Mặc định chạy ngay không cần cài MySQL)
spring.datasource.url=jdbc:h2:mem:wms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
